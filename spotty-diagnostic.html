<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spotty diagnostic</title><style>body{font:16px system-ui,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}button{font:inherit;padding:.6rem 1rem}pre{white-space:pre-wrap;background:#1d1d1d;padding:1rem;border-radius:.5rem;overflow:auto}.ok{color:#8fda8f}.bad{color:#ff9c9c}</style></head><body><h1>Spotty diagnostic</h1><p>This page asks the local Carousel server to discover an LMS player and inspect Spotty. It does not need a player ID or developer console.</p><button id="run">Run diagnostic</button><p id="status"></p><pre id="output">Ready.</pre><script type="module">const b=document.querySelector('#run'),s=document.querySelector('#status'),o=document.querySelector('#output');async function run(){b.disabled=true;s.className='';s.textContent='Querying LMS / Spotty…';o.textContent='';try{const r=await fetch('/api/diagnostics/spotty',{cache:'no-store'});const text=await r.text();let data;try{data=JSON.parse(text)}catch{throw new Error(text||('HTTP '+r.status))}o.textContent=JSON.stringify(data,null,2);s.className=data.available?'ok':'bad';s.textContent=data.available?'Spotty detected. Copy the JSON below back into the chat.':'Diagnostic completed but Spotty was not detected. Copy the JSON below back into the chat.'}catch(e){s.className='bad';s.textContent='Diagnostic failed';o.textContent=String(e)}finally{b.disabled=false}}b.addEventListener('click',run);run();</script></body></html>
