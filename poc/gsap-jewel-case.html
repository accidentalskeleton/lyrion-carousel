<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carousel — GSAP jewel-case POC</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c0e12;color:#eee}
body{margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(94vw,850px);text-align:center}
.scene{height:430px;display:grid;place-items:center;perspective:1300px;overflow:visible}
.case{position:relative;width:270px;height:270px;transform-style:preserve-3d;transform:rotateX(7deg) rotateY(-12deg)}
.tray{position:absolute;inset:0;background:linear-gradient(145deg,#24262b,#090a0d);border:5px solid #8e969c77;box-shadow:12px 20px 36px #0009,inset 0 0 0 4px #0006;display:grid;place-items:center}
.disc{width:220px;height:220px;border-radius:50%;background:repeating-radial-gradient(circle,#c7d0d8 0 2px,#9da6ae 3px 5px,#dce2e7 6px 7px);display:grid;place-items:center;box-shadow:0 2px 12px #0008}
.disc::after{content:"";width:35px;height:35px;border-radius:50%;background:#121418;border:7px solid #aeb5b9}
.front{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;z-index:2}
.front-face,.booklet{position:absolute;inset:0;backface-visibility:hidden}
.front-face{border:7px solid #c7d7e477;background:linear-gradient(125deg,#10293d,#315b6c 50%,#151c28);box-shadow:inset 0 0 0 3px #fff3,4px 8px 20px #0008;display:grid;place-items:center}
.front-face strong{font-size:30px;letter-spacing:.12em}.front-face small{display:block;margin-top:12px;letter-spacing:.3em}
.booklet{transform:rotateY(180deg);background:#d4cbb4;color:#222;display:grid;place-items:center;border:7px solid #9b9a8c;font-size:20px}
.hinge{position:absolute;left:-8px;top:0;width:12px;height:100%;background:linear-gradient(90deg,#8a9299,#e7eef4aa,#6e7983);z-index:3}
.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
button{background:#242b33;color:white;border:1px solid #59616b;border-radius:8px;padding:12px 20px;font-size:15px;cursor:pointer}
button:focus-visible{outline:3px solid #b5e2ff}
p{color:#abb5bf;font-size:14px;line-height:1.5}
@media(prefers-reduced-motion:reduce){.case,.front{transition:none}}
</style></head>
<body><main><h1>GSAP jewel-case experiment</h1><div class="scene"><div class="case" id="case"><div class="tray"><div class="disc"></div></div><div class="front" id="front"><div class="hinge"></div><div class="front-face"><div><strong>CAROUSEL</strong><small>THE ALBUM</small></div></div><div class="booklet">Booklet / inside cover</div></div></div></div><div class="controls"><button id="toggle">Open case</button><button id="flip">Turn case over</button><button id="reset">Reset</button></div><p id="status" role="status">Loading GSAP…</p><p>Isolated prototype: no LMS calls, playback actions, or changes to the live Carousel UI. Requires internet to load GSAP for this experiment.</p>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
const status=document.querySelector('#status'),toggle=document.querySelector('#toggle'),flip=document.querySelector('#flip'),reset=document.querySelector('#reset');
if(!window.gsap){status.textContent='GSAP could not load. Check network access.';for(const b of [toggle,flip,reset])b.disabled=true;}
else{
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const duration=reduced?0:0.8;
 let opened=false,turned=false;
 const front=document.querySelector('#front'),caseEl=document.querySelector('#case');
 const update=()=>{toggle.textContent=opened?'Close case':'Open case';flip.textContent=turned?'Turn to front':'Turn case over';status.textContent=(opened?'Open':'Closed')+' · '+(turned?'Rear view':'Front view')};
 toggle.addEventListener('click',()=>{opened=!opened;gsap.to(front,{rotateY:opened?-155:0,duration,ease:'power2.inOut',overwrite:true});update()});
 flip.addEventListener('click',()=>{turned=!turned;gsap.to(caseEl,{rotateY:turned?168:-12,duration:duration*1.2,ease:'power2.inOut',overwrite:true});update()});
 reset.addEventListener('click',()=>{opened=false;turned=false;gsap.to(front,{rotateY:0,duration,overwrite:true});gsap.to(caseEl,{rotateY:-12,duration,overwrite:true});update()});
 update();
}
</script></main></body></html>
