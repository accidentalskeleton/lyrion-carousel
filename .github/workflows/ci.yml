name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: JavaScript and Python regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install "Pillow>=10,<13"
      - name: Check Python syntax
        run: python -m py_compile server.py tests/test_server.py
      - name: Test JavaScript
        run: node tests/regressions.mjs
      - name: Test Python
        run: python -W always::ResourceWarning -m unittest discover -s tests -p 'test_*.py'
