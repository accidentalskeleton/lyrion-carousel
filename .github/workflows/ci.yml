name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: JavaScript and Python regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install "Pillow>=10,<13"
      - name: Check Python syntax
        run: python -m py_compile server.py tests/test_server.py
      - name: Test JavaScript
        run: node tests/regressions.mjs
      - name: Test Python
        run: python -W always::ResourceWarning -m unittest discover -s tests -p 'test_*.py'
      - name: Use the standard Ubuntu package mirror
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install browser test tools
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/carousel-browser" playwright@1.56.1
          "$RUNNER_TEMP/carousel-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test shelf in Chromium
        run: |
          python3 -m http.server 8089 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/carousel-browser/node_modules/playwright/index.mjs" node tests/shelf-playwright.mjs http://127.0.0.1:8089/
