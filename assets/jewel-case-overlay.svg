<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" preserveAspectRatio="none">
  <defs>
    <linearGradient id="plastic" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".10" stop-color="#dff2f8" stop-opacity=".06"/><stop offset=".55" stop-color="#fff" stop-opacity=".015"/><stop offset=".90" stop-color="#cce5ee" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/></linearGradient>
    <linearGradient id="blackSpine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08090a"/><stop offset=".18" stop-color="#202225"/><stop offset=".48" stop-color="#0a0b0c"/><stop offset=".80" stop-color="#252729"/><stop offset="1" stop-color="#070809"/></linearGradient>
    <pattern id="spineRibs" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M2 0V9M6 0V9" stroke="#fff" stroke-opacity=".05" stroke-width="1.4"/></pattern>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".78"/><stop offset=".35" stop-color="#c5d8df" stop-opacity=".23"/><stop offset=".72" stop-color="#718087" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".54"/></linearGradient>
    <linearGradient id="openingEdge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f8fdff" stop-opacity=".68"/><stop offset=".45" stop-color="#b9ccd3" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".50"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".22"/><stop offset=".12" stop-color="#fff" stop-opacity=".03"/><stop offset=".32" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#fff" stop-opacity="0"/><stop offset=".96" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity=".16"/></linearGradient>
  </defs>
  <!-- top/right/bottom outer clear shell only: deliberately no clear vertical rail left of the black hinge -->
  <path d="M20 18H982V862H20" fill="none" stroke="url(#rim)" stroke-width="14" opacity=".72"/>
  <path d="M20 28H972V852H20" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3"/>
  <!-- black ribbed hinge, approximately 9% of case width as in the photographic reference -->
  <rect x="20" y="28" width="90" height="824" rx="2" fill="url(#blackSpine)" stroke="#060708" stroke-width="3"/>
  <rect x="23" y="31" width="84" height="818" fill="url(#spineRibs)"/>
  <!-- narrow clear separator between black hinge and booklet opening -->
  <rect x="110" y="28" width="24" height="824" fill="url(#openingEdge)" fill-opacity=".30" stroke="#f4fbfd" stroke-opacity=".48" stroke-width="3"/>
  <path d="M114 31V849M131 31V849" stroke="#fff" stroke-opacity=".38" stroke-width="2.5"/>
  <!-- clear opening border around the booklet -->
  <path d="M134 31H972V849H134" fill="none" stroke="url(#openingEdge)" stroke-width="7" opacity=".60"/>
  <path d="M141 39H965V841H141" fill="none" stroke="#11191c" stroke-opacity=".28" stroke-width="2"/>
  <!-- right-hand moulded latch slots -->
  <g fill="#f5fbfd" fill-opacity=".10" stroke="#fff" stroke-opacity=".32" stroke-width="3"><rect x="963" y="190" width="8" height="118" rx="3"/><rect x="963" y="572" width="8" height="118" rx="3"/></g>
  <!-- transparent front-lid sheen over the booklet area -->
  <rect x="134" y="28" width="838" height="824" fill="url(#plastic)"/>
  <path d="M170 32L330 32 630 848 490 848Z" fill="#fff" fill-opacity=".018"/>
  <rect x="134" y="28" width="838" height="824" fill="url(#shine)"/>
</svg>
